<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Screensaver</title>
<style>
  html,body{
    height:100%;
    margin:0;
    background: linear-gradient(180deg,#0f172a,#020617);
    font-family: system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  .float-window{
    position: absolute;
    width: 200px;
    height: 200px;
    display:flex;
    flex-direction:column;
    transform-origin: center;
    will-change: transform, left, top;
    user-select:none;
    cursor: grab;
  }

  .mongoose-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
  }

  /* gentle pulse while moving */
  .moving {
    animation: subtlePulse 500ms linear infinite;
  }
  @keyframes subtlePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .pop {
    animation: popAnim 150ms ease-out;
  }
  @keyframes popAnim {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .hint {
    position: fixed;
    right: 14px;
    bottom: 14px;
    font-size:12px;
    color:#9fb0ff;
    background: rgba(255,255,255,0.02);
    padding:8px 10px;
    border-radius:8px;
    backdrop-filter: blur(4px);
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="win" class="float-window">
    <img src="Mongoose.png" alt="Mongoose" class="mongoose-img">
  </div>


<script>
(() => {
  const win = document.getElementById('win');

  let x = 100;
  let y = 100;

  // INCREASED INITIAL SPEEDS
  let vx = 400; 
  let vy = 350; 

  let last = performance.now();
  let paused = false;

  win.style.left = x + 'px';
  win.style.top = y + 'px';
  win.classList.add('moving');

  function getBounds(){
    return { width: window.innerWidth, height: window.innerHeight };
  }

  function frame(now) {
    if (paused) {
      last = now;
      requestAnimationFrame(frame);
      return;
    }
    const dt = (now - last) / 1000;
    last = now;

    x += vx * dt;
    y += vy * dt;

    const w = win.offsetWidth;
    const h = win.offsetHeight;
    const bounds = getBounds();
    let collided = false;

    if (x <= 0) { x = 0; vx = Math.abs(vx); collided = true; }
    else if (x + w >= bounds.width) { x = bounds.width - w; vx = -Math.abs(vx); collided = true; }

    if (y <= 0) { y = 0; vy = Math.abs(vy); collided = true; }
    else if (y + h >= bounds.height) { y = bounds.height - h; vy = -Math.abs(vy); collided = true; }

    win.style.left = Math.round(x) + 'px';
    win.style.top  = Math.round(y) + 'px';

    if (collided) {
      win.classList.remove('pop');
      void win.offsetWidth;
      win.classList.add('pop');

      // INCREASED SPEED MULTIPLIER (from 1.04 to 1.15)
      // Clamped at 2500px/s so he doesn't leave the dimension
      const speed = Math.min(2500, Math.hypot(vx,vy) * 1.15);
      const angle = Math.atan2(vy, vx);
      vx = speed * Math.cos(angle);
      vy = speed * Math.sin(angle);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // Toggle Pause
  win.addEventListener('click', () => {
    paused = !paused;
    win.classList.toggle('moving', !paused);
    if (!paused) last = performance.now();
  });

  // Hotkey support
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      paused = !paused;
      win.classList.toggle('moving', !paused);
      last = performance.now();
    }
  });

  window.addEventListener('resize', () => {
    const bounds = getBounds();
    x = Math.max(0, Math.min(x, bounds.width - win.offsetWidth));
    y = Math.max(0, Math.min(y, bounds.height - win.offsetHeight));
  });
})();
</script>
</body>
</html>
