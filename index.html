<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Classroom</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1e1e2f;
            --accent-color: #7676ff;
            --highlight: #00d2ff;
            --text-main: #ffffff;
            --text-dim: #a0a0b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e1e3f 0%, #0f0f1a 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Featured Section for Outside Games */
        .featured-section {
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
        }

        .featured-card {
            background: linear-gradient(145deg, #2a2a45, #161625);
            border: 3px solid var(--highlight);
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .featured-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 45px rgba(0, 210, 255, 0.5);
        }

        .featured-card a {
            text-decoration: none;
            color: var(--highlight);
            font-size: 2rem;
            font-weight: 800;
            display: block;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .featured-card p {
            color: var(--text-dim);
            margin-top: 10px;
            font-style: italic;
        }

        .header-actions {
            margin-bottom: 50px;
        }

        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .download-btn:hover {
            background-color: #45a049;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
            transform: translateY(-2px);
        }

        /* Improved Grid Layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid #3f3f5a;
            border-radius: 15px;
            height: 100px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-8px);
            background-color: #252540;
            border-color: var(--accent-color);
            box-shadow: 0 12px 24px rgba(0,0,0,0.5);
        }

        .game-card a {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-card:hover a {
            color: var(--accent-color);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .featured-card a { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <h1>Game Collection</h1>

    <div class="featured-section">
        <div class="featured-card">
            <a href="games.html">Outside Games</a>
            <p>(Stole this from a another github website but larger storage of games)</p>
        </div>
    </div>
    
    <div class="header-actions">
        <a href="all_games.zip" download class="download-btn">⬇ Download All Games</a>
    </div>
    
    <div class="game-grid">
        <div class="game-card"><a href="Mongoose.png">Games</a></div>
        <div class="game-card"><a href="Mongoose.png">Securly Unblock Complete</a></div>
        <div class="game-card"><a href="Screensaver.html">Screensaver</a></div>
        <div class="game-card"><a href="pets.html">SAP</a></div>
        <div class="game-card"><a href="HTMLeditor.html">Editor</a></div>
        
    </div>

</body>
</html>
